worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 500m;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # WebSocket 升级映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =========================================================================
    # Upstream 定义
    # =========================================================================
    upstream frontend {
        server frontend:3000;
    }

    upstream backend-main {
        server backend-main:10001;
    }

    upstream backend-cloud {
        server backend-cloud:10002;
    }

    upstream landppt {
        server landppt:10006;
    }

    upstream excalidraw {
        server excalidraw:80;
    }

    upstream excalidraw-room {
        server excalidraw-room:10008;
    }

    upstream service-asr {
        server service-asr:10005;
    }

    upstream firebase-firestore {
        server excalidraw-firebase:10009;
    }

    upstream firebase-storage {
        server excalidraw-firebase:10010;
    }

    # =========================================================================
    # Server 配置
    # =========================================================================
    server {
        listen 80;
        server_name _;

        # ----- 主后端 API（保留 /api/ 前缀传递）-----
        location /api/ {
            proxy_pass http://backend-main;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket 支持（AI 流式通信）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 300s;
        }

        # ----- 云存储后端（rewrite: /cloud/api/xxx → /api/xxx）-----
        location /cloud/ {
            rewrite ^/cloud/(.*)$ /$1 break;
            proxy_pass http://backend-cloud;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            # 大文件上传
            client_max_body_size 500m;
        }

        # ----- PPT 生成（strip /ppt/ 前缀）-----
        location /ppt/ {
            rewrite ^/ppt/(.*)$ /$1 break;
            proxy_pass http://landppt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # ----- 协作白板静态文件（strip /whiteboard/ 前缀）-----
        location /whiteboard/ {
            rewrite ^/whiteboard/(.*)$ /$1 break;
            proxy_pass http://excalidraw;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- 白板协作 WebSocket（strip /collab/ 前缀）-----
        location /collab/ {
            rewrite ^/collab/(.*)$ /$1 break;
            proxy_pass http://excalidraw-room;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # ----- ASR REST API（strip /asr/ 前缀）-----
        location /asr/ {
            rewrite ^/asr/(.*)$ /$1 break;
            proxy_pass http://service-asr;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ----- ASR WebSocket 同传（strip /ws/asr/ 前缀）-----
        location /ws/asr/ {
            rewrite ^/ws/asr/(.*)$ /$1 break;
            proxy_pass http://service-asr;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
        }

        # ----- Firebase Firestore 模拟器 -----
        location /firebase/firestore/ {
            rewrite ^/firebase/firestore/(.*)$ /$1 break;
            proxy_pass http://firebase-firestore;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- Firebase Storage 模拟器 -----
        location /firebase/storage/ {
            rewrite ^/firebase/storage/(.*)$ /$1 break;
            proxy_pass http://firebase-storage;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- 默认：Nuxt SSR 前端 -----
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
